<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Saturn Mails - Sign Up</title>

<style>

body {
    margin: 0;
        height: 100vh;
            background: linear-gradient(135deg, #020024, #090979, #1b005f);
                font-family: Arial, sans-serif;
                    display: flex;
                        justify-content: center;
                            align-items: center;
                                color: white;
                                }

                                .box {
                                    background: rgba(255,255,255,0.12);
                                        padding: 40px;
                                            border-radius: 25px;
                                                text-align: center;
                                                    width: 320px;
                                                        backdrop-filter: blur(10px);
                                                        }

                                                        .saturn {
                                                            font-size: 50px;
                                                            }

                                                            h1 {
                                                                font-size: 35px;
                                                                
                                                                }

                                                                p {
                                                                    font-size: 18px;
                                                                    }

                                                                    input {
                                                                        width: 90%;
                                                                            padding: 15px;
                                                                                margin: 15px;
                                                                                    border-radius: 15px;
                                                                                        border: none;
                                                                                            font-size: 16px;
                                                                                            }

                                                                                            button {
                                                                                                width: 100%;
                                                                                                    padding: 15px;
                                                                                                        border-radius: 20px;
                                                                                                            border: none;
                                                                                                                background: #00d9ff;
                                                                                                                    color: #001;
                                                                                                                        font-size: 18px;
                                                                                                                            cursor: pointer;
                                                                                                                            }

                                                                                                                            </style>

                                                                                                                            </head>

                                                                                                                            <body>

                                                                                                                            <div class="box">

                                                                                                                            <div class="saturn">🪐</div>

                                                                                                                            <h1>Saturn Mails</h1>

                                                                                                                            <p>Enter your email address</p>

                                                                                                                            <input type="email" placeholder="example@gmail.com">

                                                                                                                            <button>
                                                                                                                            Send Verification Code
                                                                                                                            </button>

                                                                                                                            </div>

                                                                                                                            </body>

                                                                                                                            </html>
